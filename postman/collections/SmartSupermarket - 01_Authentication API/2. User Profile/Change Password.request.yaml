$kind: http-request
url: "{{baseUrl}}/api/auth/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "oldPassword": "CustomerPassword123!",
      "newPassword": "NewCustomerPassword123!"
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
order: 2000
