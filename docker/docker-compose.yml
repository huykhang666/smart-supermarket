version: '3.8'

services:
  # PostgreSQL 16 Database Container
  postgres-db:
    image: postgres:16-alpine
    container_name: smart_supermarket_db
    restart: always
    environment:
      POSTGRES_DB: AISupermarketDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourPassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
