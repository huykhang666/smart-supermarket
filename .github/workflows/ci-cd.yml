name: Smart Supermarket CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    - name: Restore dependencies
      run: dotnet restore ./Backend/SmartSupermarket.Backend.csproj
    - name: Build Backend
      run: dotnet build ./Backend/SmartSupermarket.Backend.csproj --no-restore
